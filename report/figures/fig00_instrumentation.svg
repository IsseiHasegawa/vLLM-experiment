<svg xmlns="http://www.w3.org/2000/svg" width="720" height="340" viewBox="0 0 720 340" role="img" font-family="Helvetica, Arial, sans-serif">
<title>Three-layer instrumentation architecture</title>
<desc>The benchmark client controls the arrival rate; the instrumented vLLM fork writes one JSONL log on the request axis and one on the step axis; an external logger samples GPU and per-process CPU at 1 Hz.</desc>
<style>
  .t  { font-size: 14px; fill: #2C2C2A; }
  .th { font-size: 14px; font-weight: 500; }
  .ts { font-size: 12px; }
</style>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<rect x="14" y="150" width="160" height="56" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text class="th" x="94" y="174" text-anchor="middle" fill="#2C2C2A">Benchmark client</text>
<text class="ts" x="94" y="192" text-anchor="middle" fill="#5F5E5A">controls arrival rate</text>

<line x1="178" y1="178" x2="196" y2="178" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="200" y="50" width="300" height="250" rx="20" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text class="th" x="350" y="82" text-anchor="middle" fill="#26215C">Instrumented vLLM (fork)</text>
<text class="ts" x="350" y="102" text-anchor="middle" fill="#534AB7">instrumentation branch, 3 files</text>

<rect x="220" y="126" width="260" height="70" rx="12" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text class="th" x="350" y="152" text-anchor="middle" fill="#04342C">requests.jsonl (request axis)</text>
<text class="ts" x="350" y="174" text-anchor="middle" fill="#0F6E56">queued / prefill / decode / e2e</text>

<rect x="220" y="212" width="260" height="70" rx="12" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text class="th" x="350" y="238" text-anchor="middle" fill="#412402">steps.jsonl (step axis)</text>
<text class="ts" x="350" y="260" text-anchor="middle" fill="#854F0B">sched / exec / KV usage / batch</text>

<line x1="520" y1="178" x2="506" y2="178" stroke="#5F5E5A" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>

<rect x="526" y="150" width="170" height="56" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text class="th" x="611" y="174" text-anchor="middle" fill="#2C2C2A">Resource logger</text>
<text class="ts" x="611" y="192" text-anchor="middle" fill="#5F5E5A">external, 1 Hz GPU + CPU</text>
</svg>