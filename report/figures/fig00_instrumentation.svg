<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 680 340" role="img" font-family="Helvetica, Arial, 'Hiragino Sans', sans-serif">
<title>計装の3層構造</title>
<desc>クライアントが到着率を制御し、計装済みvLLMがリクエスト単位とステップ単位のJSONLを出力、外部の資源ロガーが1HzでGPUとCPUを記録する。</desc>
<style>
  .t  { font-size: 14px; fill: #2C2C2A; }
  .th { font-size: 14px; font-weight: 500; }
  .ts { font-size: 12px; }
  @media (prefers-color-scheme: dark) { .t { fill: #E8E6DE; } }
</style>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<rect x="30" y="150" width="140" height="56" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text class="th" x="100" y="174" text-anchor="middle" fill="#2C2C2A">クライアント</text>
<text class="ts" x="100" y="192" text-anchor="middle" fill="#5F5E5A">到着率を制御</text>

<line x1="174" y1="178" x2="196" y2="178" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="200" y="50" width="300" height="250" rx="20" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text class="th" x="350" y="82" text-anchor="middle" fill="#26215C">計装済み vLLM (fork)</text>
<text class="ts" x="350" y="102" text-anchor="middle" fill="#534AB7">instrumentation ブランチ / +192行</text>

<rect x="220" y="126" width="260" height="70" rx="12" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text class="th" x="350" y="152" text-anchor="middle" fill="#04342C">requests.jsonl（リクエスト軸）</text>
<text class="ts" x="350" y="174" text-anchor="middle" fill="#0F6E56">queued / prefill / decode / e2e</text>

<rect x="220" y="212" width="260" height="70" rx="12" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text class="th" x="350" y="238" text-anchor="middle" fill="#412402">steps.jsonl（ステップ軸）</text>
<text class="ts" x="350" y="260" text-anchor="middle" fill="#854F0B">sched / exec / KV使用率 / batch</text>

<line x1="504" y1="178" x2="524" y2="178" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="530" y="150" width="110" height="56" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text class="th" x="585" y="174" text-anchor="middle" fill="#2C2C2A">資源ログ</text>
<text class="ts" x="585" y="192" text-anchor="middle" fill="#5F5E5A">1 Hz GPU/CPU</text>
</svg>
