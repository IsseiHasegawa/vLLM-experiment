<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 680 320" role="img" font-family="Helvetica, Arial, 'Hiragino Sans', sans-serif">
<title>実験セッションとグループの構成</title>
<desc>セッションAは単一GPUで91ラン、セッションBは閉ループ中心に39ラン、セッションCは4GPU機でテンソル並列78ラン。合計208ラン。</desc>
<style>
  .th { font-size: 14px; font-weight: 500; }
  .ts { font-size: 12px; }
</style>

<rect x="40" y="50" width="190" height="220" rx="20" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text class="th" x="135" y="80" text-anchor="middle" fill="#26215C">セッション A</text>
<text class="ts" x="135" y="100" text-anchor="middle" fill="#534AB7">7/29 · 1×A40 · 91ラン</text>
<text class="ts" x="58" y="134" fill="#26215C">S1　7B × ShareGPT</text>
<text class="ts" x="58" y="158" fill="#26215C">S2　7B × random</text>
<text class="ts" x="58" y="182" fill="#26215C">S3　0.5B × ShareGPT</text>
<text class="ts" x="58" y="206" fill="#26215C">I1 / I2　入出力比</text>
<text class="ts" x="58" y="230" fill="#534AB7">C1off　計装対照</text>
<text class="ts" x="58" y="254" fill="#534AB7">A1a / A1b　アンカー</text>

<rect x="250" y="50" width="170" height="220" rx="20" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text class="th" x="335" y="80" text-anchor="middle" fill="#04342C">セッション B</text>
<text class="ts" x="335" y="100" text-anchor="middle" fill="#0F6E56">7/30 · 1×A40 · 39ラン</text>
<text class="ts" x="268" y="134" fill="#04342C">C2　閉ループ c=1–64</text>
<text class="ts" x="268" y="158" fill="#04342C">S2b　random 高レート</text>
<text class="ts" x="268" y="182" fill="#0F6E56">A1c　アンカー</text>

<rect x="440" y="50" width="200" height="220" rx="20" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text class="th" x="540" y="80" text-anchor="middle" fill="#4A1B0C">セッション C</text>
<text class="ts" x="540" y="100" text-anchor="middle" fill="#993C1D">7/31 · 4×A40 · 78ラン</text>
<text class="ts" x="458" y="134" fill="#4A1B0C">G1　tp=1 (1 GPU)</text>
<text class="ts" x="458" y="158" fill="#4A1B0C">G2　tp=2 (2 GPU)</text>
<text class="ts" x="458" y="182" fill="#4A1B0C">G4　tp=4 (4 GPU)</text>
<text class="ts" x="458" y="206" fill="#4A1B0C">C2x　c=128</text>
<text class="ts" x="458" y="230" fill="#993C1D">A1d　アンカー</text>
</svg>
